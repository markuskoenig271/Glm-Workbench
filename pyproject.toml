[project]
name = "glm-workbench"
version = "0.1.0"
description = "A local workbench to test out and learn GLMs for actuarial pricing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "playwright>=1.61.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pricing_engine --cov-report=term-missing"

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["statsmodels.*", "streamlit.*"]
ignore_missing_imports = true
